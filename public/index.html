<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Parti Ligi">
  <meta name="theme-color" content="#0b1020">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ui.css">
  <title>Parti Ligi</title>
</head>
<body>
  <main id="app">
    <!-- Ana menü -->
    <section id="home" class="screen">
      <div class="hero">
        <div class="hero-rings" aria-hidden="true">
          <svg viewBox="0 0 120 100">
            <!-- Parti Ligi logosu: konfeti içinde kupa -->
            <g>
              <rect x="14" y="20" width="7" height="4" rx="1.5" fill="#38bdf8" transform="rotate(-25 17 22)"/>
              <rect x="98" y="16" width="7" height="4" rx="1.5" fill="#f472b6" transform="rotate(30 101 18)"/>
              <rect x="22" y="62" width="6" height="4" rx="1.5" fill="#4ade80" transform="rotate(40 25 64)"/>
              <rect x="94" y="58" width="6" height="4" rx="1.5" fill="#fb923c" transform="rotate(-35 97 60)"/>
              <circle cx="30" cy="40" r="2.6" fill="#facc15"/>
              <circle cx="90" cy="38" r="2.6" fill="#38bdf8"/>
              <circle cx="104" cy="44" r="2" fill="#4ade80"/>
              <circle cx="16" cy="46" r="2" fill="#f472b6"/>
            </g>
            <path d="M40 22 Q40 10 33 10 Q24 10 24 22 Q24 36 44 42" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
            <path d="M80 22 Q80 10 87 10 Q96 10 96 22 Q96 36 76 42" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
            <path d="M38 8 H82 V30 Q82 54 60 58 Q38 54 38 30 Z" fill="#fbbf24"/>
            <path d="M42 8 H52 V30 Q52 46 60 54 Q44 50 42 30 Z" fill="#fde68a" opacity=".7"/>
            <path d="M60 18 L63.8 26 L72.5 27 L66 33 L67.7 41.6 L60 37.3 L52.3 41.6 L54 33 L47.5 27 L56.2 26 Z" fill="#fff7d6"/>
            <rect x="55" y="57" width="10" height="12" fill="#f59e0b"/>
            <rect x="44" y="68" width="32" height="8" rx="3" fill="#fbbf24"/>
            <rect x="38" y="76" width="44" height="14" rx="4" fill="#7c3aed"/>
            <rect x="44" y="81" width="32" height="4" rx="2" fill="#c4b5fd"/>
          </svg>
        </div>
        <h1 class="title">PARTİ<span>LİGİ</span></h1>
        <p class="hero-sub">Telefonda, arkadaşlarla, <b id="gameCount">10</b> mini oyunluk lig</p>
      </div>

      <div class="profile" id="profileCard">
        <button class="profile-av" id="homeAvatarBtn" data-custom aria-label="karakterini düzenle">
          <canvas id="homePortrait" width="72" height="72"></canvas>
          <span class="edit-badge">✏️</span>
        </button>
        <label class="field grow"><span>Adın</span>
          <input id="name" maxlength="14" placeholder="Oyuncu" autocomplete="off" spellcheck="false">
        </label>
      </div>

      <div class="menu3">
        <button id="btnCreate" class="tile t1"><span class="ti">🏟️</span><b>Oda Kur</b><small>Arkadaşlarını çağır, oyunları seç</small></button>
        <button id="btnJoinToggle" class="tile t2"><span class="ti">🔑</span><b>Odaya Katıl</b><small>Arkadaşının verdiği kodu gir</small></button>
        <div id="joinRow" class="join-row hidden">
          <input id="joinCode" class="code-input" maxlength="4" placeholder="KOD" autocomplete="off" autocapitalize="characters" spellcheck="false">
          <button id="btnJoin" class="btn primary">Katıl</button>
        </div>
        <button class="tile t3" data-custom><span class="ti">👕</span><b>Karakterim</b><small>Giydir, renklerini değiştir</small></button>
      </div>

      <!-- geliştirici: botlarla yerel oyun (adrese ?bot ya da ?cizim eklenince görünür) -->
      <div class="row solo-row dev-only hidden">
        <button id="btnSolo" class="btn ghost grow">🤖 Botlarla Oyna</button>
        <div class="stepper" aria-label="bot sayısı">
          <button data-step="-1" aria-label="azalt">−</button>
          <b id="botN">3</b>
          <button data-step="1" aria-label="artır">+</button>
        </div>
      </div>
      <section class="games-sec hidden"><div id="homeGames" class="game-grid"></div></section>
    </section>

    <!-- Karakter -->
    <section id="custom" class="screen hidden">
      <div class="custom-head">
        <h2>👕 Karakterim</h2>
        <div class="row">
          <button id="btnSpin" class="btn small ghost on">🔄 Döndür: Açık</button>
        </div>
      </div>
      <div class="custom-stage">
        <canvas id="customCv" class="custom-cv"></canvas>
        <div id="customEmotes" class="emotes"></div>
      </div>
      <div id="customTabs" class="ctabs"></div>
      <div id="customOpts" class="custom-opts"></div>
      <div class="gen-bar">
        <button id="btnGenM" class="btn gen">👨 Erkek<small>rastgele</small></button>
        <button id="btnRandomLook" class="btn gen mid">🎲 Rastgele<small>her şey</small></button>
        <button id="btnGenF" class="btn gen">👩 Kadın<small>rastgele</small></button>
      </div>
      <button id="btnCustomDone" class="btn primary">Kaydet</button>
    </section>

    <!-- Lobi -->
    <section id="lobby" class="screen hidden">
      <div class="lobby-head">
        <div class="code-card">
          <span class="muted">Oda kodu</span>
          <div id="lobbyCode" class="code">----</div>
          <button id="btnShare" class="btn small">📨 Davet et</button>
        </div>
      </div>
      <div class="sec-head"><h2>Oyuncular</h2><span class="muted" id="lobbyCount"></span></div>
      <ul id="lobbyPlayers" class="plist"></ul>
      <div class="sec-head"><h2>Ne oynayalım?</h2><span class="muted" id="modesHint"></span></div>
      <div id="modes" class="modes"></div>
      <div id="teamPanel" class="team-panel hidden"></div>
      <div id="lobbyHost" class="row sticky-row">
        <button id="btnAddBot" class="btn">+ Bot</button>
        <button id="btnStart" class="btn primary grow">Başlat</button>
      </div>
      <p id="lobbyWait" class="muted center">Oda sahibinin başlatması bekleniyor…</p>
      <div class="row">
        <button class="btn ghost" data-custom>👕 Karakterim</button>
        <button class="btn ghost" data-chat>💬 Laf at</button>
        <button id="btnLeave" class="btn ghost">Çık</button>
      </div>
    </section>

    <!-- Oyun -->
    <section id="game" class="screen hidden">
      <header class="hud">
        <button id="btnExit" class="icon-btn" aria-label="çık">✕</button>
        <button id="btnLand" class="icon-btn land-btn hidden" aria-label="yatay mod">↻ Yatay</button>
        <button id="btnAdmin" class="icon-btn adm-btn hidden" aria-label="yönetici paneli">⚙️<i id="admBadge" class="adm-badge hidden"></i></button>
        <canvas id="hudMe" class="hud-me" width="64" height="64"></canvas>
        <span id="hudInfo"></span>
        <span id="hudTeam" class="hud-team hidden"></span>
        <span id="hudTimer" class="timer"></span>
      </header>
      <div class="timerbar"><i id="timerFill"></i></div>
      <div id="stage" class="stage">
        <canvas id="cv"></canvas>
        <canvas id="cv3" class="hidden"></canvas>
        <canvas id="mini" class="mini hidden"></canvas>
        <div id="banner" class="banner hidden"></div>
        <button id="btnView" class="view-btn hidden" aria-label="görünümü değiştir">👁️ FPS</button>
        <button class="chat-btn" data-chat aria-label="hazır mesaj gönder">💬</button>
      </div>
      <div id="panel" class="panel"></div>
    </section>
  </main>
  <div id="overlay" class="overlay hidden"></div>
  <canvas id="confetti" class="confetti"></canvas>
  <div id="feed" class="feed" aria-live="polite"></div>
  <div id="quick" class="quick hidden">
    <div class="quick-sheet">
      <div class="quick-title">Laf at 😈</div>
      <form id="quickForm" class="quick-form" autocomplete="off">
        <input id="quickText" type="text" maxlength="60" placeholder="Bir şey yaz…" enterkeyhint="send" autocapitalize="sentences" aria-label="Mesajın">
        <button class="btn primary" type="submit">Gönder</button>
      </form>
      <div id="quickGrid" class="quick-grid"></div>
    </div>
  </div>
  <div id="admAlert" class="adm-alert hidden"></div>
  <div id="admin" class="quick hidden">
    <div class="quick-sheet adm-sheet">
      <div class="quick-title">⚙️ Yönetici paneli</div>
      <div id="admBody"></div>
      <button class="btn ghost" id="admClose">Kapat</button>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
