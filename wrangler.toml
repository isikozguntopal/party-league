name = "parti-ligi"
main = "cloudflare/worker.mjs"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# TURN (isteğe bağlı): npx wrangler secret put TURN_KEY_ID / TURN_API_TOKEN
